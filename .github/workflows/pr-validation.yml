name: PR validation

# Release-protection workflow: every pull request (and push to main) must
# pass lint, the deterministic test suites, database-backed migration tests,
# the migration-history consistency check, and a production build.
#
# Recommended branch protection for `main` (repository settings - cannot be
# set from a workflow file): require the "validate" and "database-tests"
# checks to pass before merging.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:migrations
      - run: npm run check:assets
      - run: npm run test:playhq-normalise
      - run: npm run test:fantasy-orchestrator
      - run: npm run test:fantasy-reconciliation
      - run: npm run test:fantasy-seasons
      - run: npm run smoke:fantasy
      - run: npm run smoke:content
      - run: npm run test:apparel-pricing
      - run: npm run test:payments-partial
      - run: npm run test:stripe
      - run: npm run test:merch-export
      - run: npm run build

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:apparel-catalogue
      - run: npm run test:payments-ledger
      - run: npm run test:migration-replay

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (critical = blocking)
        run: npm audit --audit-level=critical
      - name: Dependency audit (high = informational)
        # Known highs currently require a breaking next@16 upgrade; those are
        # reviewed manually rather than auto-applied.
        run: npm audit --audit-level=high || true
