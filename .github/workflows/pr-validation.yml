name: PR validation

# Release-protection workflow: every pull request (and push to main) must
# pass lint + typecheck, the deterministic test suite (`npm test`),
# database-backed migration tests, secret/dependency scans and a production
# build. The jobs run in parallel; the `validate` job aggregates them so the
# existing required status check name keeps working in branch protection.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runs every test:/smoke:/check: script and the direct test scripts that
      # need no database, secrets or network. See scripts/run-all-tests.mjs.
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:apparel-catalogue
      - run: npm run test:payments-ledger
      # Previously never run in CI; advisory until it has passed on main once,
      # then remove continue-on-error.
      - run: npm run test:gallery-albums
        continue-on-error: true
      - run: npm run test:security-privilege-defaults-hardening:db
      - run: npm run test:migration-replay

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (high and critical = blocking)
        run: npm audit --audit-level=high

  # Aggregate gate. Keeps the historical `validate` check name that branch
  # protection may require; fails unless lint, tests and build all passed.
  validate:
    if: always()
    needs: [lint, tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, tests and build to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required validation job did not succeed ($result)."
              exit 1
            fi
          done
