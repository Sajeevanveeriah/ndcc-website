name: PR validation

# Release-protection workflow: every pull request (and push to main) must
# pass lint, deterministic test suites, database-backed migration tests,
# the migration-history consistency check, and a production build.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:admin-permissions
      - run: npm run test:admin-auth
      - run: npm run test:admin-delete
      - run: npm run test:auth-callback-security
      - run: npm run test:admin-csrf
      - run: npm run test:google-maps-embed-security
      - run: npm run test:public-link-security
      - run: npm run test:calendar-subscription
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/test-committee-calendar-subscription.mjs
      - run: npm run test:email-html-security
      - run: npm run test:public-order-input-security
      - run: npm run test:cms-navigation
      - run: npm run test:committee-auth-schema
      - run: npm run test:core-schema
      - run: node --experimental-strip-types scripts/test-dino-coach.mjs
      - run: npm run lint
      - run: npm run check:migrations
      - run: npm run test:dino-coach-rls-hardening
      - run: npm run test:profiles-role-escalation-hardening
      - run: npm run test:security-privilege-defaults-hardening
      - run: npm run check:assets
      - run: npm run test:playhq-normalise
      - run: npm run test:fantasy-orchestrator
      - run: npm run test:fantasy-reconciliation
      - run: npm run test:fantasy-seasons
      - run: npm run smoke:fantasy
      - run: npm run smoke:content
      - run: npm run test:apparel-pricing
      - run: npm run test:payments-partial
      - run: npm run test:payment-ledger-export
      - run: npm run test:payment-operations-hardening
      - run: npm run test:stripe
      - run: npm run test:stripe-dispute-integrity
      - run: npm run test:payment-reference-integrity
      - run: npm run test:receipt-delivery-outbox
      - run: npm run test:payment-receipts
      - run: npm run test:order-notifications
      - run: npm run test:player-registration
      - run: npm run test:merch-export
      - run: npm run build

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:apparel-catalogue
      - run: npm run test:payments-ledger
      - run: npm run test:security-privilege-defaults-hardening:db
      - run: npm run test:migration-replay

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (critical = blocking)
        run: npm audit --audit-level=critical
      - name: Dependency audit (high = informational)
        run: npm audit --audit-level=high || true
