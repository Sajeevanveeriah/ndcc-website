name: NDCC isolated workspace
on:
  push:
    branches: [codex/ndcc-premium-receipts]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package source and installed dependencies
        run: tar -czf "$RUNNER_TEMP/ndcc-workspace.tar.gz" --exclude=.git --exclude=.next .
      - uses: actions/upload-artifact@v4
        with:
          name: ndcc-workspace
          path: ${{ runner.temp }}/ndcc-workspace.tar.gz
          retention-days: 1
